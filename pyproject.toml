[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar-compare-local"
version = "0.8.0"
description = "Local and authorized HTTP range image-copy comparison with resumable caching"
readme = "README.md"
license = "0BSD"
requires-python = ">=3.10,<3.14"
dependencies = ["numpy>=1.26.4,<3", "opencv-python>=4.11,<6", "Pillow>=10,<13"]

[project.scripts]
avatar-compare = "avatar_compare.__main__:main"
avatar-compare-gui = "avatar_compare.gui:main"

[tool.setuptools.package-data]
avatar_compare = ["web/*.html", "web/*.css", "web/*.js"]

[tool.setuptools.packages.find]
include = ["avatar_compare*"]
